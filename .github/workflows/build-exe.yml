name: Build PowerPoint Generator

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller python-pptx pillow tk

    - name: Build executable
      run: |
        pyinstaller --onefile --windowed --name "GeradorPowerPoint" gerador_ppt.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: GeradorPowerPoint
        path: dist/GeradorPowerPoint.exe

    # Opcional (usando a versão mais recente da action de release)
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/GeradorPowerPoint.exe
