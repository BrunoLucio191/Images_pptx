name: Build PowerPoint Generator

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller python-pptx pillow tk

    - name: Build executable
      run: |
        pyinstaller --onefile --windowed --name "GeradorPowerPoint" main.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: GeradorPowerPoint
        path: dist/GeradorPowerPoint.exe
