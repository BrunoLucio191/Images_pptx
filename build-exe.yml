\f0\fs24 \cf0 name: Build PowerPoint Generator\
\
on:\
  push:\
    branches: [ "main" ]\
  pull_request:\
    branches: [ "main" ]\
\
jobs:\
  build:\
    runs-on: windows-latest  # Necess\'e1rio para o pacote python-pptx\
\
    steps:\
    - uses: actions/checkout@v4\
\
    - name: Set up Python\
      uses: actions/setup-python@v4\
      with:\
        python-version: '3.10'\
\
    - name: Install dependencies\
      run: |\
        python -m pip install --upgrade pip\
        pip install pyinstaller python-pptx pillow tk\
\
    - name: Build executable\
      run: |\
        pyinstaller --onefile --windowed --name "GeradorPowerPoint" gerador_ppt.py\
        # --windowed evita o console aparecer\
        # --name define o nome do execut\'e1vel\
\
    - name: Upload artifact\
      uses: actions/upload-artifact@v3\
      with:\
        name: GeradorPowerPoint\
        path: dist/GeradorPowerPoint.exe\
\
    # Opcional: criar um release automaticamente quando tag \'e9 criada\
    - name: Create Release\
      if: startsWith(github.ref, 'refs/tags/')\
      uses: softprops/action-gh-release@v1\
      with:\
        files: dist/GeradorPowerPoint.exe}